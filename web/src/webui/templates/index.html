<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coverage Web</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>Coverage Optimizer</h1>
      <form id="runForm">
        <label>Input mode</label>
        <select name="input_mode" id="inputMode">
          <option value="upload">Upload file</option>
          <option value="editor">Write code</option>
        </select>

        <div id="uploadSection">
          <label>C++ file</label>
          <input type="file" id="fileInput" name="file" accept=".cpp,.cc,.cxx,.c++" required />
        </div>

        <div id="editorSection" style="display:none;">
          <label>Filename</label>
          <input type="text" name="source_filename" value="snippet.cpp" />
          <label>Code</label>
          <textarea name="source_code" rows="14" placeholder="#include <iostream>\nint main(){ std::cout << \"Hi\"; return 0; }"></textarea>
        </div>

        <label>Coverage type</label>
        <select name="coverage_type"><option value="line">line</option><option value="branch">branch</option><option value="function">function</option></select>
        <label>Max iterations</label><input type="number" name="max_iters" value="5" min="1" max="20" />
        <label>Coverage threshold</label><input type="number" name="coverage_threshold" value="100" min="1" max="100" />
        <label>Objective</label><select name="objective"><option value="coverage">coverage</option><option value="mutation">mutation</option><option value="hybrid">hybrid</option></select>
        <label>Mutation threshold</label><input type="number" name="mutation_threshold" value="70" min="1" max="100" />
        <label>Model</label><input type="text" name="model" value="gemini-2.5-flash" />
        <button type="submit">Run</button>
      </form>
      <p id="status"></p>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
