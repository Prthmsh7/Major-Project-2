<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coverage Optimizer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>LLM Coverage Optimizer</h1>
      <form id="uploadForm">
        <label>Input mode</label>
        <select name="input_mode" id="inputMode">
          <option value="upload">Upload file</option>
          <option value="editor">Write in editor</option>
        </select>

        <div id="uploadSection">
        <label>Source file (.cpp)</label>
        <input type="file" name="file" id="fileInput" accept=".cpp,.cc,.cxx,.c++" required />
        </div>

        <div id="editorSection" style="display:none;">
          <label>Source filename</label>
          <input type="text" name="source_filename" value="snippet.cpp" />
          <label>Write C++ code</label>
          <div id="monacoEditor" aria-label="C++ code editor"></div>
          <textarea name="source_code" id="sourceCode" rows="16" hidden></textarea>
        </div>

        <label>Coverage type</label>
        <select name="coverage_type">
          <option value="line">Line</option>
          <option value="branch">Branch</option>
          <option value="function">Function</option>
        </select>

        <label>Max iterations</label>
        <input type="number" name="max_iters" value="5" min="1" max="20" />

        <label>Coverage threshold</label>
        <input type="number" name="coverage_threshold" value="100" min="1" max="100" />

        <label>Model</label>
        <input type="text" name="model" value="gemini-2.5-flash" />

        <label>Focus mode</label>
        <select name="focus_mode">
          <option value="coverage">Coverage (default)</option>
          <option value="diff">Diff-focused (git changed lines first)</option>
        </select>

        <button type="submit">Start</button>
      </form>
      <p id="status"></p>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
